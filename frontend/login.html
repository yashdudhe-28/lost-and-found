<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-container label {
            display: block;
            margin: 15px 0 7px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .login-container button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #173b57;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #245879;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">🎓 Campus Lost & Found</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="report-lost.html">Lost Items</a>
            <a href="found-items.html">Found Items</a>
        </nav>
    </header>

    <main class="login-container">
        <h1>Welcome Back! 👋</h1>
        <p>Login to your campus account</p>

        <form id="loginForm">

            <label for="email">College Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

            <div class="message" id="message"></div>
        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>
    </main>

    <footer>
        <p>© 2026 Campus Lost & Found</p>
    </footer>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document.getElementById("message").textContent =
                    "Login form is working! Backend authentication is not connected yet.";

                document.getElementById("password").value = "";
            });
    </script>

</body>
</html>
